name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: type a version like v1.0.0 to also publish a GitHub Release"
        required: false
        default: ""
  push:
    branches: [ main, master ]
    tags: [ "v*" ]            # pushing a tag such as v1.0.0 builds and publishes a Release

permissions:
  contents: write             # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          NAME="SipAndSmile-${TAG:-dev}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SipAndSmile-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release
        if: steps.apk.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "$GITHUB_SHA" \
            --title "Sip & Smile ${{ steps.apk.outputs.tag }}" \
            --notes "Install: download the .apk on your phone, open it, allow 'Install unknown apps' and tap Install." \
            || gh release upload "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" --clobber
